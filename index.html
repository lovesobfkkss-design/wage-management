<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>강한영어수학학원 급여관리시스템</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/pretendard/1.3.9/static/pretendard.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 로그인 화면 -->
  <div id="loginScreen" class="login-container">
    <div class="login-card">
      <div class="login-logo">
        <div class="login-logo-icon">강한</div>
        <div class="login-title">강한영어수학학원</div>
        <div class="login-subtitle">급여관리시스템</div>
      </div>

      <div class="role-selector">
        <button class="role-btn active" onclick="selectRole('admin', this)">
          <div class="role-btn-icon">&#128100;</div>
          <div class="role-btn-label">관리자</div>
        </button>
        <button class="role-btn" onclick="selectRole('staff', this)">
          <div class="role-btn-icon">&#129489;&#8205;&#127979;</div>
          <div class="role-btn-label">직원</div>
        </button>
      </div>

      <div id="adminLogin">
        <div class="form-group">
          <label class="form-label">학원코드</label>
          <input type="text" id="adminAcademyCode" class="form-input" placeholder="예: ganghan" onkeypress="if(event.key==='Enter') loginAdmin()">
        </div>
        <div class="form-group">
          <label class="form-label">로그인 ID</label>
          <input type="text" id="adminLoginId" class="form-input" placeholder="관리자 로그인 ID" onkeypress="if(event.key==='Enter') loginAdmin()">
        </div>
        <div class="form-group">
          <label class="form-label">비밀번호</label>
          <input type="password" id="adminPassword" class="form-input" placeholder="비밀번호 입력" onkeypress="if(event.key==='Enter') loginAdmin()">
        </div>
        <button class="btn btn-primary" style="width:100%" onclick="loginAdmin()">로그인</button>
        <button class="btn btn-outline" style="width:100%; margin-top:0.75rem;" onclick="openAcademySignupModal()">학원 관리자 가입</button>
      </div>

      <div id="staffLogin" class="hidden">
        <div class="form-group">
          <label class="form-label">학원코드</label>
          <input type="text" id="staffAcademyCode" class="form-input" placeholder="예: ganghan" onkeypress="if(event.key==='Enter') loginStaff()">
        </div>
        <div class="form-group">
          <label class="form-label">로그인 ID</label>
          <input type="text" id="staffLoginId" class="form-input" placeholder="직원 로그인 ID" onkeypress="if(event.key==='Enter') loginStaff()">
        </div>
        <div class="form-group">
          <label class="form-label">비밀번호</label>
          <input type="password" id="staffPassword" class="form-input" placeholder="비밀번호 입력" onkeypress="if(event.key==='Enter') loginStaff()">
        </div>
        <button class="btn btn-accent" style="width:100%" onclick="loginStaff()">출근 기록하기</button>
        <button class="btn btn-outline" style="width:100%; margin-top:0.75rem;" onclick="openStaffSignupModal()">직원 가입 신청</button>
        <p style="font-size: 0.75rem; color: var(--text-light); margin-top: 0.5rem; text-align: center;">
          로그인 ID는 학원 관리자에게 확인하세요.
        </p>
      </div>
    </div>
  </div>

  <!-- 메인 앱 -->
  <div id="mainApp" class="hidden">
    <header class="header">
      <div class="header-top">
        <h1>
          <span class="header-logo">강한</span>
          급여관리시스템
        </h1>
        <div class="business-selector" id="businessSelector">
          <!-- JS로 렌더링 -->
        </div>
      </div>
      <nav class="nav-tabs" id="navTabs">
        <!-- JS로 렌더링 -->
      </nav>
    </header>

    <main class="container" id="mainContent">
      <!-- JS로 렌더링 -->
    </main>
  </div>

  <!-- 모달 -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title" id="modalTitle">모달</h3>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer" id="modalFooter"></div>
    </div>
  </div>

  <!-- Toast 알림 -->
  <div class="copy-toast" id="copyToast">복사되었습니다!</div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <!-- PDF export: html2canvas + jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- Excel 파일 읽기: SheetJS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <!-- JavaScript 파일 로드 (순서 중요) -->
  <script src="js/utils.js?v=17"></script>
  <script src="js/firebase-config.js?v=17"></script>
  <script src="js/data.js?v=17"></script>
  <script src="js/pdf-generator.js?v=17"></script>
  <script src="js/app.js?v=17"></script>
</body>
</html>
